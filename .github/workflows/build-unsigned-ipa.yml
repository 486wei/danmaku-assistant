name: build-ipa

on:
  workflow_dispatch:

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15, macos-15-intel, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    steps:
      - name: 看看这个 macOS 标签能不能起来
        run: |
          uname -a
          sw_vers || true
          xcodebuild -version || true
