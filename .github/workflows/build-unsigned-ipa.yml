name: build-unsigned-ipa
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  ipa:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 显示 Xcode 版本
        run: xcodebuild -version
      - name: 编译未签名 ipa
        run: bash build-ipa.sh
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: DanmakuAssistant-unsigned-ipa
          path: build/ipa/DanmakuAssistant-unsigned.ipa
          if-no-files-found: error
