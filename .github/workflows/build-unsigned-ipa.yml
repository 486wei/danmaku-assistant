name: build-ipa

on:
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: 还原 Xcode 工程目录（网页上传把子目录拍平了）
        shell: bash
        run: |
          set -eux
          mkdir -p DanmakuAssistant/DanmakuAssistant/Assets.xcassets/AppIcon.appiconset
          mkdir -p DanmakuAssistant/DanmakuAssistant.xcodeproj
          mv *.swift Info.plist DanmakuAssistant/DanmakuAssistant/
          mv project.pbxproj DanmakuAssistant/DanmakuAssistant.xcodeproj/
          if [ -f "Contents (1).json" ]; then
            mv "Contents (1).json" DanmakuAssistant/DanmakuAssistant/Assets.xcassets/AppIcon.appiconset/Contents.json
          fi
          mv Contents.json DanmakuAssistant/DanmakuAssistant/Assets.xcassets/Contents.json
          mv icon_*.png DanmakuAssistant/DanmakuAssistant/Assets.xcassets/AppIcon.appiconset/
          find DanmakuAssistant -type f | sort

      - name: 编译前修正两处源码问题
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib

          cv = pathlib.Path('DanmakuAssistant/DanmakuAssistant/ContentView.swift')
          lines = cv.read_text().split('\n')
          for i, l in enumerate(lines):
              if 'foregroundStyle(m.errorText' in l:
                  lines[i] = '                .foregroundStyle(m.errorText == nil ? Color.secondary : Color.red)'
                  print('patched ContentView line', i + 1)
          cv.write_text('\n'.join(lines))

          aw = pathlib.Path('DanmakuAssistant/DanmakuAssistant/AssWriter.swift')
          lines = aw.read_text().split('\n')
          for i, l in enumerate(lines):
              if 'dialogue(' in l and 'mv)' in l:
                  lines[i] = '                events.append(dialogue(t, t + stay, "{" + mv + color + "}" + esc(text)))'
                  print('patched AssWriter line', i + 1)
          aw.write_text('\n'.join(lines))
          PY
          grep -n 'foregroundStyle(m.errorText' DanmakuAssistant/DanmakuAssistant/ContentView.swift
          grep -n 'mv + color' DanmakuAssistant/DanmakuAssistant/AssWriter.swift

      - name: 显示 Xcode 版本
        run: xcodebuild -version

      - name: 编译未签名 ipa
        shell: bash
        run: |
          set -o pipefail
          bash build-ipa.sh 2>&1 | tee build.log

      - name: 错误摘要
        if: failure()
        shell: bash
        run: |
          echo "===== error 行 ====="
          grep -n "error:" build.log | head -40 || true
          echo "===== 最后 60 行 ====="
          tail -60 build.log || true

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: 上传 ipa
        uses: actions/upload-artifact@v4
        with:
          name: DanmakuAssistant-unsigned-ipa
          path: build/ipa/DanmakuAssistant-unsigned.ipa
          if-no-files-found: error
